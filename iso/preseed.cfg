# preseed.cfg — installation Debian 13 (trixie) automatisée + miyukini-toolbox.
# Embarqué dans l'ISO custom ; l'installeur le lit via preseed/file=/cdrom/preseed.cfg.

#### Localisation
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)

#### Réseau (DHCP ; le hostname sera unique au post-install si besoin)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-miyukini
d-i netcfg/get_domain string lab.local
d-i netcfg/hostname string debian-miyukini

#### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

#### Horloge / fuseau
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

#### Comptes (root désactivé, un utilisateur sudo — mot de passe lab à changer)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Admin
d-i passwd/username string admin
d-i passwd/user-password password Azerty77!
d-i passwd/user-password-again password Azerty77!
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-default-groups string audio cdrom video sudo

#### Partitionnement (disque entier, schéma simple)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

#### Système de base + logiciels
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl gnupg ca-certificates sudo
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

#### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

#### Fin : redémarrage automatique
d-i finish-install/reboot_in_progress note

#### late_command : installe miyukini-toolbox depuis le dépôt signé en ligne.
# (Variante hors-ligne : voir iso/README.md — on embarque le .deb dans l'ISO.)
d-i preseed/late_command string \
  in-target sh -c 'curl -fsSL https://tssr.miyukini.com/apt/key.gpg | gpg --dearmor -o /usr/share/keyrings/miyukini.gpg'; \
  in-target sh -c 'echo "deb [signed-by=/usr/share/keyrings/miyukini.gpg] https://tssr.miyukini.com/apt stable main" > /etc/apt/sources.list.d/miyukini.list'; \
  in-target apt-get update; \
  in-target apt-get install -y miyukini-toolbox
